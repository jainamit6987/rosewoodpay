<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>

    <!-- PWA "Add to Home Screen" icon config (2026-09-14) - Metro's web
         export does not auto-generate any of this (unlike the old, now-
         removed @expo/webpack-config PWA plugin), so without these tags
         iOS Safari/Android Chrome have no real icon to use when installed
         and fall back to a blank/black placeholder. See
         mobile/scripts/generate-pwa-icons.js for how the icon files
         themselves were generated, and manifest.json alongside this file
         for the Android/Chrome side. -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#1a73e8" />
    <!-- iOS-specific tags Safari checks even with a manifest present -
         without these, "Add to Home Screen" opens as a normal browser tab
         (URL bar and all) instead of the full-screen standalone app. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Society" />
    <!-- The standard (non-Apple) equivalent of the tag above, honored by
         Android Chrome. -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
